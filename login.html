<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI Resume Analyzer</title>
  <meta name="description" content="Sign in to your AI Resume Analyzer account to access AI-powered resume analysis." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-page {
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #4338CA 100%);
    }
  </style>
</head>
<body>

<div class="auth-page">
  <div style="width:100%;max-width:420px;">

    <!-- Card -->
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">CI</div>
        <div class="auth-logo-text">
          <div class="brand-title">Carrer Intelligence</div>
          <div class="brand-sub">Powered by CodeCooker</div>
        </div>
      </div>

      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-sub">Sign in to your account to continue</p>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input
              type="email" class="form-control" id="loginEmail" placeholder="example@gmail.com" autocomplete="email"
            />
          </div>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <label class="form-label" for="loginPassword" style="margin:0;">Password</label>
            <a href="#" class="auth-link" style="font-size:12px;" onclick="showToast('Password reset will be available after backend integration.','info');return false;">
              Forgot Password?
            </a>
          </div>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input
              type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password"
            />
            <i class="bi bi-eye-slash input-toggle" id="loginPassToggle"></i>
          </div>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <!-- Remember me -->
        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" />
            Remember me
          </label>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>or continue with</span></div>

      <!-- Admin Login link -->
      <a href="admin-login.html" class="btn btn-ghost btn-full" style="margin-bottom:4px;">
        <i class="bi bi-shield-lock"></i> Admin Login
      </a>

      <!-- Register link -->
      <div class="auth-footer">
        Don't have an account?
        <a href="register.html" class="auth-link">Create one free</a>
      </div>
    </div>

    <!-- Back to home -->
    <div style="text-align:center;margin-top:18px;">
      <a href="index.html" style="font-size:13px;color:var(--text-muted);">
        <i class="bi bi-arrow-left"></i> Back to Home
      </a>
    </div>

  </div>
</div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
