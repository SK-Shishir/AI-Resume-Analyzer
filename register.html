<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AI Resume Analyzer</title>
  <meta name="description" content="Create a free AI Resume Analyzer account to start getting AI-powered feedback on your resume." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-page">
  <div style="width:100%;max-width:440px;">

    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">CI</div>
        <div class="auth-logo-text">
          <div class="brand-title">Carrer Intelligence</div>
          <div class="brand-sub">Powered by CodeCooker</div>
        </div>
      </div>

      <h1 class="auth-heading">Create your account </h1>
      <p class="auth-sub">Start analyzing your resume for free</p>

      <!-- Register Form -->
      <form id="registerForm" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <div class="input-wrapper">
            <i class="bi bi-person input-icon"></i>
            <input
              type="text" class="form-control" id="regName" placeholder="your name" autocomplete="name"
            />
          </div>
          <div class="invalid-feedback">Full name is required (min 2 characters).</div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input
              type="email" class="form-control" id="regEmail" placeholder="example@gmail.com" autocomplete="email"
            />
          </div>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input
              type="password" class="form-control" id="regPassword" placeholder="Min. 8 characters" autocomplete="new-password"
            />
            <i class="bi bi-eye-slash input-toggle"></i>
          </div>
          <div class="invalid-feedback">Password must be at least 8 characters.</div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="regConfirm">Confirm Password</label>
          <div class="input-wrapper">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              type="password" class="form-control" id="regConfirm" placeholder="Repeat your password" autocomplete="new-password"
            />
            <i class="bi bi-eye-slash input-toggle"></i>
          </div>
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>

        

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="registerBtn">
          <i class="bi bi-person-check"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html" class="auth-link">Sign in here</a>
      </div>
    </div>

    <!-- Back to home -->
    <div style="text-align:center;margin-top:18px;">
      <a href="index.html" style="font-size:13px;color:var(--text-muted);">
        <i class="bi bi-arrow-left"></i> Back to Home
      </a>
    </div>

  </div>
</div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
