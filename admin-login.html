<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — AI Resume Analyzer</title>
  <meta name="description" content="Administrator login for AI Resume Analyzer dashboard." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-page {
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #4338CA 100%);
    }
  </style>
</head>
<body>

<div class="auth-page">
  <div style="width:100%;max-width:420px;">

    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon" style="background:linear-gradient(135deg,#1E1B4B,#4338CA);">
          <i class="bi bi-shield-lock-fill" style="font-size:16px;"></i>
        </div>
        <div class="auth-logo-text">
          <div class="brand-title">Carrer Intelligence</div>
          <div class="brand-sub">Administration Portal</div>
        </div>
      </div>

      <!-- Admin badge -->
      <div style="display:inline-flex;align-items:center;gap:6px;background:#EDE9FE;color:#4338CA;border-radius:var(--radius-full);padding:5px 14px;font-size:12px;font-weight:600;margin-bottom:16px;">
        <i class="bi bi-shield-fill-check"></i> Admin Access Required
      </div>

      <h1 class="auth-heading">Admin Login</h1>
      <p class="auth-sub">Sign in to access the admin dashboard</p>

      <!-- Admin Login Form -->
      <form id="adminLoginForm" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="adminEmail">Admin Email</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input
              type="email"
              class="form-control"
              id="adminEmail"
              placeholder="admin@example.com"
              autocomplete="email"
            />
          </div>
          <div class="invalid-feedback">Admin email is required.</div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input
              type="password"
              class="form-control"
              id="adminPassword"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <i class="bi bi-eye-slash input-toggle"></i>
          </div>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <!-- Remember me -->
        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" />
            Remember me
          </label>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-full btn-lg" style="background:linear-gradient(135deg,#1E1B4B,#4338CA);color:white;box-shadow:0 4px 16px rgba(67,56,202,0.3);">
          <i class="bi bi-shield-lock"></i> Login as Admin
        </button>
      </form>

      <div class="auth-footer" style="margin-top:18px;">
        <a href="login.html" class="auth-link">
          <i class="bi bi-arrow-left"></i> Back to User Login
        </a>
      </div>
    </div>

    <!-- Back to home -->
    <div style="text-align:center;margin-top:18px;">
      <a href="index.html" style="font-size:13px;color:rgba(255,255,255,0.7);">
        <i class="bi bi-house"></i> Back to Home
      </a>
    </div>

  </div>
</div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
